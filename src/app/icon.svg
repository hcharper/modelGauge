<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d15"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="tankClip">
      <rect x="8" y="12" width="48" height="48" rx="8"/>
    </clipPath>
  </defs>
  <!-- Tank cap -->
  <rect x="20" y="4" width="24" height="10" rx="3" fill="url(#cap)" opacity="0.9"/>
  <!-- Tank body outline -->
  <rect x="8" y="12" width="48" height="48" rx="8" fill="url(#body)" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Gold fluid -->
  <g clip-path="url(#tankClip)">
    <!-- Fluid fill (~65%) -->
    <rect x="8" y="28" width="48" height="32" fill="url(#gold)" opacity="0.9"/>
    <!-- Wave on top of fluid -->
    <path d="M8,29 C16,25 24,33 32,29 C40,25 48,33 56,29 L56,32 L8,32 Z" fill="#fbbf24" opacity="0.5"/>
    <!-- Shimmer -->
    <rect x="14" y="32" width="6" height="24" rx="3" fill="white" opacity="0.12"/>
  </g>
  <!-- Graduation marks -->
  <line x1="10" y1="36" x2="18" y2="36" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="10" y1="48" x2="18" y2="48" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>
</svg>
